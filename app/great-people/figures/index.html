<!DOCTYPE html>
<html lang="ar">
<head>

    <title>أبرز 100 شخصية في الإسلام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
        .back-button { position: fixed; top: 15px; left: 15px; background-color: #6a5acd; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; }
        .back-button:hover { background-color: #5a4abf; }
        .back-button svg { width: 20px; height: 20px; fill: white; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .figure-card { background: white; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: transform 0.3s; border: 1px solid #eee; }
        .figure-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .figure-name { font-weight: bold; color: #374151; margin: 10px 0; }
        .figure-title { font-size: 0.9em; color: #6b7280; }
    </style>
</head>

    <button class="back-button" onclick="window.history.back()">

            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11.414V14a1 1 0 11-2 0V6.586L6.707 9.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 6.586z" clip-rule="evenodd"/>
        </svg>
